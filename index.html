<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能设备 Dashboard</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #eee;
            --text2: #aaa;
            --green: #00c853;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 手机外框模拟 */
        .phone-frame {
            width: 360px;
            min-height: 640px;
            background: var(--card);
            border-radius: 30px;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.15);
        }

        /* 屏幕切换 */
        .screen { display: none; }
        .screen.active { display: block; }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 8px 0 16px;
            font-size: 13px;
            color: var(--text2);
        }

        /* 主菜单网格 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 20px;
        }

        .menu-card {
            background: var(--accent);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }
        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.3);
        }
        .menu-card .icon { font-size: 36px; margin-bottom: 8px; }
        .menu-card .label { font-size: 14px; color: var(--text2); }

        /* 环境数据卡片 */
        .env-card {
            background: var(--accent);
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
        }
        .env-card h3 { font-size: 16px; margin-bottom: 12px; color: var(--text2); }
        .env-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .env-item .value { font-size: 28px; font-weight: bold; }
        .env-item .unit { font-size: 12px; color: var(--text2); }
        .env-item .label { font-size: 12px; color: var(--text2); margin-top: 4px; }

        /* 时钟 */
        .clock-display {
            text-align: center;
            padding: 30px 0;
        }
        .clock-time { font-size: 56px; font-weight: 200; letter-spacing: 4px; }
        .clock-date { font-size: 16px; color: var(--text2); margin-top: 8px; }

        /* 底部导航 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 14px 0 0;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .nav-btn {
            background: none;
            border: none;
            color: var(--text2);
            font-size: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .nav-btn.active { color: var(--highlight); background: rgba(233,69,96,0.15); }
        .nav-btn .nav-icon { font-size: 20px; display: block; }

        /* 返回按钮 */
        .back-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .back-btn:hover { border-color: var(--highlight); color: var(--highlight); }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .screen.active { animation: fadeIn 0.3s ease; }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- ==================== 状态栏 ==================== -->
    <div class="status-bar">
        <span id="status-time">12:00</span>
        <span id="status-wifi">📶 WiFi</span>
    </div>

    <!-- ==================== 主菜单 ==================== -->
    <div id="screen-main" class="screen active">
        <h2 style="font-weight:300;margin-bottom:4px;">🤖 智能助手</h2>
        <p style="color:var(--text2);font-size:13px;">欢迎回来</p>
        <div class="main-grid">
            <div class="menu-card" onclick="switchScreen('clock')">
                <div class="icon">⏰</div>
                <div class="label">时钟</div>
            </div>
            <div class="menu-card" onclick="switchScreen('env')">
                <div class="icon">🌡️</div>
                <div class="label">环境</div>
            </div>
            <div class="menu-card" onclick="switchScreen('chat')">
                <div class="icon">💬</div>
                <div class="label">AI 对话</div>
            </div>
            <div class="menu-card" onclick="switchScreen('status')">
                <div class="icon">📶</div>
                <div class="label">设备状态</div>
            </div>
            <div class="menu-card" onclick="switchScreen('robot')">
                <div class="icon">🤖</div>
                <div class="label">表情</div>
            </div>
            <div class="menu-card" onclick="switchScreen('settings')">
                <div class="icon">⚙️</div>
                <div class="label">设置</div>
            </div>
        </div>
    </div>

    <!-- ==================== 时钟屏幕 ==================== -->
    <div id="screen-clock" class="screen">
        <button class="back-btn" onclick="switchScreen('main')">← 返回</button>
        <div class="clock-display">
            <div class="clock-time" id="clock-time">--:--</div>
            <div class="clock-date" id="clock-date">----年--月--日</div>
        </div>
    </div>

    <!-- ==================== 环境屏幕 ==================== -->
    <div id="screen-env" class="screen">
        <button class="back-btn" onclick="switchScreen('main')">← 返回</button>
        <h3 style="margin-bottom:12px;">🌡️ 环境监测</h3>
        <div class="env-card">
            <div class="env-row">
                <div class="env-item">
                    <div class="value" id="env-temp">--</div>
                    <div class="unit">°C</div>
                    <div class="label">温度</div>
                </div>
                <div class="env-item">
                    <div class="value" id="env-humi">--</div>
                    <div class="unit">%</div>
                    <div class="label">湿度</div>
                </div>
                <div class="env-item">
                    <div class="value" id="env-pres">--</div>
                    <div class="unit">hPa</div>
                    <div class="label">气压</div>
                </div>
            </div>
        </div>
        <div class="env-card" style="margin-top:12px;">
            <div class="env-row">
                <div class="env-item">
                    <div class="value" id="env-alti">--</div>
                    <div class="unit">m</div>
                    <div class="label">海拔</div>
                </div>
                <div class="env-item">
                    <div class="value" id="env-update">--</div>
                    <div class="unit"></div>
                    <div class="label">更新时间</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== AI 对话屏幕 ==================== -->
    <div id="screen-chat" class="screen">
        <button class="back-btn" onclick="switchScreen('main')">← 返回</button>
        <h3 style="margin-bottom:12px;">💬 AI 对话</h3>
        <div id="chat-list" style="height:280px;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;line-height:1.6;">
            <p style="color:var(--text2);">🤖 你好！我是 AI 助手，有什么可以帮你的？</p>
        </div>
        <div style="display:flex;gap:8px;">
            <input id="chat-input" type="text" placeholder="输入消息..."
                   style="flex:1;padding:10px 14px;border-radius:20px;border:none;background:var(--accent);color:var(--text);font-size:13px;"
                   onkeydown="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()" style="padding:10px 18px;border-radius:20px;border:none;background:var(--highlight);color:white;cursor:pointer;font-size:13px;">发送</button>
        </div>
    </div>

    <!-- ==================== 设备状态屏幕 ==================== -->
    <div id="screen-status" class="screen">
        <button class="back-btn" onclick="switchScreen('main')">← 返回</button>
        <h3 style="margin-bottom:12px;">📶 设备状态</h3>
        <div class="env-card">
            <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;">
                <span style="color:var(--text2);">WiFi</span><span id="status-wifi-detail">--</span>
                <span style="color:var(--text2);">IP 地址</span><span id="status-ip">--</span>
                <span style="color:var(--text2);">芯片</span><span id="status-chip">--</span>
                <span style="color:var(--text2);">屏幕</span><span id="status-lcd">--</span>
                <span style="color:var(--text2);">传感器</span><span id="status-sensors">--</span>
                <span style="color:var(--text2);">运行时间</span><span id="uptime">--</span>
            </div>
        </div>
    </div>

    <!-- ==================== 机器人表情屏幕 ==================== -->
    <div id="screen-robot" class="screen">
        <button class="back-btn" onclick="switchScreen('main')">← 返回</button>
        <h3 style="margin-bottom:12px;">🤖 机器人表情</h3>
        <div id="robot-face" style="text-align:center;padding:40px 0;">
            <div style="font-size:80px;transition:all 0.3s;" id="robot-emoji">😊</div>
            <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                <button onclick="setRobotFace('😊')" style="padding:8px 14px;border-radius:20px;border:none;background:var(--accent);color:var(--text);cursor:pointer;">😊 开心</button>
                <button onclick="setRobotFace('😮')" style="padding:8px 14px;border-radius:20px;border:none;background:var(--accent);color:var(--text);cursor:pointer;">😮 惊讶</button>
                <button onclick="setRobotFace('🤔')" style="padding:8px 14px;border-radius:20px;border:none;background:var(--accent);color:var(--text);cursor:pointer;">🤔 思考</button>
                <button onclick="setRobotFace('😴')" style="padding:8px 14px;border-radius:20px;border:none;background:var(--accent);color:var(--text);cursor:pointer;">😴 待机</button>
                <button onclick="setRobotFace('🗣️')" style="padding:8px 14px;border-radius:20px;border:none;background:var(--accent);color:var(--text);cursor:pointer;">🗣️ 说话</button>
            </div>
        </div>
    </div>

    <!-- ==================== 设置屏幕 ==================== -->
    <div id="screen-settings" class="screen">
        <button class="back-btn" onclick="switchScreen('main')">← 返回</button>
        <h3 style="margin-bottom:12px;">⚙️ 设置</h3>
        <div class="env-card">
            <div style="display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:13px;align-items:center;">
                <span style="color:var(--text2);">设备 IP</span>
                <span>
                    <input id="settings-ip-input" type="text" placeholder="192.168.1.100"
                           style="width:140px;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:var(--bg);color:var(--text);font-size:13px;">
                    <button onclick="setDeviceIP(document.getElementById('settings-ip-input').value.trim())"
                            style="padding:6px 14px;border-radius:8px;border:none;background:var(--highlight);color:white;cursor:pointer;font-size:12px;margin-left:8px;">连接</button>
                </span>
                <span style="color:var(--text2);">深色模式</span><span>✅ 已启用</span>
                <span style="color:var(--text2);">自动刷新</span><span>每 3 秒</span>
                <span style="color:var(--text2);">版本</span><span>v1.0.0</span>
            </div>
        </div>
    </div>

    <!-- ==================== 底部导航 ==================== -->
    <div class="bottom-nav">
        <button class="nav-btn active" data-screen="main" onclick="switchScreen('main')">
            <span class="nav-icon">🏠</span>主页
        </button>
        <button class="nav-btn" data-screen="clock" onclick="switchScreen('clock')">
            <span class="nav-icon">⏰</span>时钟
        </button>
        <button class="nav-btn" data-screen="env" onclick="switchScreen('env')">
            <span class="nav-icon">🌡️</span>环境
        </button>
        <button class="nav-btn" data-screen="chat" onclick="switchScreen('chat')">
            <span class="nav-icon">💬</span>对话
        </button>
    </div>
</div>

<script>
// ==================== 设备连接配置 ====================
const STORAGE_KEY = 'device_ip';
let DEVICE_IP = localStorage.getItem(STORAGE_KEY) || '192.168.1.100';
let DEVICE_ONLINE = false;

function getApiUrl(path) {
    if (window.location.protocol === 'file:') {
        return `http://${DEVICE_IP}${path}`;
    }
    return path;
}

function setDeviceIP(ip) {
    DEVICE_IP = ip;
    localStorage.setItem(STORAGE_KEY, ip);
    DEVICE_ONLINE = false;
    updateEnvData();
    updateStatus();
}

// ==================== 屏幕切换 ====================
function switchScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');

    document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.screen === name);
    });

    if (name === 'env') updateEnvData();
    if (name === 'status') updateStatus();
}

// ==================== 实时时钟 ====================
function updateClock() {
    const now = new Date();
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    document.getElementById('status-time').textContent =
        now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    const clockTime = document.getElementById('clock-time');
    if (clockTime) {
        clockTime.textContent = now.toLocaleTimeString('zh-CN', {
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }
    const clockDate = document.getElementById('clock-date');
    if (clockDate) {
        clockDate.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;
    }
}
setInterval(updateClock, 1000);
updateClock();

// ==================== 传感器数据（真实 API） ====================
function updateEnvData() {
    fetch(getApiUrl('/api/sensors'))
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(data => {
            DEVICE_ONLINE = true;
            updateWifiIndicator(true);
            document.getElementById('env-temp').textContent = data.temp.toFixed(1);
            document.getElementById('env-humi').textContent = data.humi.toFixed(1);
            document.getElementById('env-pres').textContent = data.pres.toFixed(1);
            document.getElementById('env-alti').textContent = data.alti.toFixed(1);

            const now = new Date();
            document.getElementById('env-update').textContent =
                now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        })
        .catch(() => {
            DEVICE_ONLINE = false;
            updateWifiIndicator(false);
        });
}
setInterval(updateEnvData, 3000);
updateEnvData();

// ==================== 设备状态（真实 API） ====================
function updateStatus() {
    fetch(getApiUrl('/api/status'))
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(data => {
            DEVICE_ONLINE = true;
            updateWifiIndicator(true);

            const detail = document.getElementById('status-wifi-detail');
            if (detail) detail.innerHTML = '<span style="color:var(--green);">🟢 已连接</span>';

            const uptime = document.getElementById('uptime');
            if (uptime) uptime.textContent = data.uptime_str || (data.uptime_sec + 's');

            document.getElementById('status-ip').textContent = DEVICE_IP;
            document.getElementById('status-chip').textContent = data.chip || 'STM32F407';
            document.getElementById('status-lcd').textContent = data.lcd || '240x320';
            document.getElementById('status-sensors').textContent = data.sensors || 'AHT20+BMP280';
        })
        .catch(() => {
            DEVICE_ONLINE = false;
            updateWifiIndicator(false);
            const detail = document.getElementById('status-wifi-detail');
            if (detail) detail.innerHTML = '<span style="color:var(--highlight);">🔴 未连接</span>';
        });
}

function updateWifiIndicator(online) {
    const statusWifi = document.getElementById('status-wifi');
    if (statusWifi) {
        statusWifi.textContent = online ? '📶 在线' : '📶 离线';
    }
}

// ==================== 机器人表情 ====================
function setRobotFace(emoji) {
    const face = document.getElementById('robot-emoji');
    if (face) {
        face.textContent = emoji;
        face.style.transform = 'scale(1.2)';
        setTimeout(() => face.style.transform = 'scale(1)', 200);
    }
}

// ==================== AI 对话 ====================
function sendChat() {
    const input = document.getElementById('chat-input');
    const list = document.getElementById('chat-list');
    const msg = input.value.trim();
    if (!msg) return;

    list.innerHTML += `<p style="text-align:right;margin:6px 0;"><span style="background:var(--highlight);color:white;padding:6px 12px;border-radius:14px;display:inline-block;max-width:80%;">${escapeHtml(msg)}</span></p>`;
    input.value = '';
    list.scrollTop = list.scrollHeight;

    if (!DEVICE_ONLINE) {
        list.innerHTML += `<p style="margin:6px 0;"><span style="background:var(--accent);padding:6px 12px;border-radius:14px;display:inline-block;max-width:80%;">🤖 设备离线，无法连接 AI</span></p>`;
        list.scrollTop = list.scrollHeight;
        return;
    }

    setTimeout(() => {
        const replies = [
            '你好！有什么可以帮助你的吗？',
            '这是一个有趣的问题！',
            '让我想想... 🤔',
            '好的，我明白了！',
            '这个功能正在开发中，敬请期待~',
        ];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        list.innerHTML += `<p style="margin:6px 0;"><span style="background:var(--accent);padding:6px 12px;border-radius:14px;display:inline-block;max-width:80%;">🤖 ${reply}</span></p>`;
        list.scrollTop = list.scrollHeight;
    }, 800);
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ==================== 初始化 ====================
document.getElementById('settings-ip-input').value = DEVICE_IP;
updateStatus();
</script>
</body>
</html>
